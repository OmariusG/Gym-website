<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Iron Pulse Gym | Registration</title>

  <!-- TAB LOGO / FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <h1 class="logo">Iron Pulse Gym</h1>
      <ul class="nav-links">
        <li><a href="index.html">About Us</a></li>
        <li><a class="active" href="registration.html">Registration</a></li>
        <li><a href="creative.html">Creative Page</a></li>
      </ul>
    </nav>
  </header>

  <main class="form-page">
    <section class="form-container">
      <h2>Membership Registration</h2>
      <p>Fill out the form below to start your fitness journey.</p>

      <div id="errorBox" class="error-box"></div>
      <div id="successBox" class="success-box"></div>

      <form id="registrationForm" novalidate>
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" />

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" />

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="Example: 555-555-5555" />

        <label for="age">Age</label>
        <input type="number" id="age" name="age" />

        <label for="membership">Membership Type</label>
        <select id="membership" name="membership">
          <option value="">Choose a membership</option>
          <option value="Basic">Basic</option>
          <option value="Premium">Premium</option>
          <option value="Student">Student</option>
          <option value="Family">Family</option>
        </select>

        <label for="goal">Fitness Goals</label>
        <textarea id="goal" name="goal" rows="4" placeholder="Tell us your fitness goals..."></textarea>

        <label for="startDate">Preferred Start Date</label>
        <input type="date" id="startDate" name="startDate" />

        <label for="experience">Workout Experience</label>
        <select id="experience" name="experience">
          <option value="">Choose experience level</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>

        <button type="submit" class="button">Submit Registration</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Iron Pulse Gym. Created for CST 2309 Final Project.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
